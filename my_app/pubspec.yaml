name: Nanapiyasa
description: "A fun Flutter kitchen learning game for kids – with drag-and-drop interaction, text-to-speech guidance, and confetti celebrations!"

#publish_to: 'none' # Remove this line if you ever want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.0          # Text-to-speech for spoken instructions and feedback
  confetti: ^0.7.0             # Confetti celebrations on correct answers
  cached_network_image: ^3.3.0 # Efficient loading and caching of network images
  tflite_flutter: ^0.12.1     # TensorFlow Lite for on-device ML inference
  
  # Firebase dependencies
  firebase_core: ^3.6.0       # Core Firebase functionality
  firebase_auth: ^5.1.1       # Firebase Authentication
  cloud_firestore: ^5.4.4     # Cloud Firestore database
  firebase_database: ^11.1.4  # Firebase Realtime Database

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0        # Recommended lints for good coding practices

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/